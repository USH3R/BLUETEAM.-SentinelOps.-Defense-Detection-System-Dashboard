# 1. Use slim Python to keep image small
FROM python:3.11-slim

# 2. Set working directory
WORKDIR /app

# 3. Copy config and requirements first (layer caching)
COPY settings.yaml .
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

# 4. Copy primary Python files
COPY main.py ingestion.py detection.py response.py reporting.py ./

# 5. Provide a dummy auth.log for immediate testing
COPY auth.log .

# 6. Expose a folder for logs (optional, for volume mounting)
VOLUME ["/app/logs"]

# 7. Default command to run orchestrator
CMD ["python", "main.py"]
