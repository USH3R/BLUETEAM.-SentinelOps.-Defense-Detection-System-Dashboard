# 1. Use a slim Python image to keep the container small
FROM python:3.11-slim

# 2. Set working directory inside the container
WORKDIR /app

# 3. Copy configuration and dependencies first for layer caching
COPY settings.yaml .
COPY requirements.txt .

# 4. Install Python dependencies
RUN pip install --no-cache-dir -r requirements.txt

# 5. Copy the main Python files
COPY main.py ingestion.py detection.py response.py reporting.py ./

# 6. Include a dummy auth.log for immediate testing
COPY auth.log .

# 7. Ensure the logs directory exists and is writable
RUN mkdir -p /app/logs && chmod 777 /app/logs
VOLUME ["/app/logs"]

# 8. Default command to run the pipeline
CMD ["python", "main.py"]
